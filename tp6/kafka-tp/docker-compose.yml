# TP6 - Apache Kafka en ligne de commande (TicketFlow)
# Auteur : Ossama Elmansouri
#
# Un seul broker en mode KRaft combiné (broker + contrôleur), sans ZooKeeper.
# Correction par rapport à l'énoncé : deux listeners ne peuvent pas écouter
# sur le même port. Dans le conteneur, PLAINTEXT écoute sur 9092 (clients du
# réseau Docker, adresse annoncée kafka:9092) et EXTERNAL sur 9094 (machine hôte).
# Le port 9092 de la machine est relié au 9094 du conteneur : les adresses vues
# par les clients restent celles de l'énoncé, kafka:9092 et localhost:9092.
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

networks:
  default:
    name: kafka-tp
