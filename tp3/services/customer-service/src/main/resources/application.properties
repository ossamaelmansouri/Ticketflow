# TP3 - Config Server (TicketFlow) - Auteur : Ossama Elmansouri
# Seules les propriétés locales restent ici. Le port, l'URL Eureka,
# l'exposition Actuator et ticketflow.message viennent du dépôt
# GitHub ticketflow-config, servi par config-server (port 8888).
spring.application.name=customer-service
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.label=main

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
