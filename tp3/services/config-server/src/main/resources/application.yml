# TP3 - Config Server (TicketFlow)
# Auteur : Ossama Elmansouri
# L'URL du dépôt est fournie par la variable d'environnement CONFIG_GIT_URI
# (ex. https://github.com/ossamaelmansouri/ticketflow-config.git).
server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: main
          try-master-branch: false
          clone-on-start: true
          refresh-rate: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
