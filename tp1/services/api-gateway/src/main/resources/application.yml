# TP1 - Gateway API (TicketFlow)
# Auteur : Ossama Elmansouri
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway

management:
  # Spring Boot 4 : l'endpoint "gateway" doit être activé (en lecture seule)
  # en plus d'être exposé, sinon /actuator/gateway/routes répond 404.
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
