# TP3 - Config Server (TicketFlow)
# Auteur : Ossama Elmansouri
# L'URL du dépôt est fournie par la variable d'environnement CONFIG_GIT_URI.
# CONFIG_SEARCH_PATHS (optionnelle, vide par défaut) indique le sous-dossier
# qui contient les fichiers quand ils ne sont pas à la racine du dépôt.
server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: main
          try-master-branch: false
          clone-on-start: true
          refresh-rate: 0
          search-paths: ${CONFIG_SEARCH_PATHS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
