# TP3 - Isolation des tests (Ossama Elmansouri)
# Les tests ne dépendent ni de Config Server ni d'Eureka : on désactive
# l'import et on fournit les valeurs normalement lues dans GitHub.
spring.application.name=customer-service
spring.cloud.config.enabled=false
spring.config.import=
eureka.client.enabled=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

ticketflow.message=message de test
